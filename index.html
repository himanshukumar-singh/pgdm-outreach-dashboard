<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jaipuria PGDM Outreach Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f4f7fb;
        }

        .dashboard-wrapper {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f4f7fb;
        }

        #dashboard {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            /*
            iframe ko actual browser viewport se
            55px zyada height di hai.

            Streamlit ka Built with Streamlit /
            Fullscreen footer isi extra area me
            chala jayega aur wrapper usse crop karega.
            */

            height: calc(100vh + 55px);

            border: none;
            margin: 0;
            padding: 0;

            display: block;
        }
    </style>
</head>


<body>

    <div class="dashboard-wrapper">

        <iframe
            id="dashboard"
            src="https://jaipuria-outreach.streamlit.app/?embed=true"
            allow="clipboard-read; clipboard-write"
            loading="eager">
        </iframe>

    </div>

</body>

</html>
