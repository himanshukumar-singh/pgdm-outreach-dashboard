<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jaipuria PGDM Outreach Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f7fb;
        }

        .dashboard-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f4f7fb;
        }

        #dashboard {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;
            margin: 0;
            padding: 0;

            display: block;
        }

        /*
        Covers Streamlit embed footer:
        "Built with Streamlit" + "Fullscreen"
        */
        .streamlit-footer-cover {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 48px;

            background: #f4f7fb;

            z-index: 999999;

            pointer-events: auto;
        }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">

        <iframe
            id="dashboard"
            src="https://jaipuria-outreach.streamlit.app/?embed=true"
            allow="clipboard-read; clipboard-write"
            loading="eager">
        </iframe>

        <div class="streamlit-footer-cover"></div>

    </div>

</body>
</html>
