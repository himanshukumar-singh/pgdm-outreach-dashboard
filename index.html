<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jaipuria PGDM Outreach Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f7fb;
        }

        #dashboard {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            border: 0;
            margin: 0;
            padding: 0;

            display: block;
        }
    </style>
</head>

<body>

    <iframe
        id="dashboard"
        src="https://jaipuria-outreach.streamlit.app/?embed=true"
        allow="clipboard-read; clipboard-write"
        loading="eager">
    </iframe>

</body>
</html>
